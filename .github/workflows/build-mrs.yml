name: Build Nikki MRS Ruleset

on:
  schedule:
    # 每天 UTC 20:00 (北京时间 04:00) 自动执行
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持手动触发运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Rule Parser
        run: python convert.py

      - name: Download & Install Mihomo CLI
        run: |
          # 获取最新的 Mihomo 编译工具
          MIHOMO_TAG=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name)
          curl -L -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_TAG}/mihomo-linux-amd64-${MIHOMO_TAG}.gz"
          gunzip mihomo.gz
          chmod +x mihomo

      - name: Compile to .mrs binary
        run: |
          # 使用 mihomo convert-ruleset 将 yaml 格式转换为 mrs 二进制文件
          ./mihomo convert-ruleset domain yaml adblock_parsed.yaml adblock.mrs

      - name: Deploy to release branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 创建并切换到 publish 分支提交二进制规则包
          git checkout --orphan publish || git checkout publish
          git rm -rf .
          cp adblock.mrs ./adblock.mrs
          git add adblock.mrs
          git commit -m "Auto update ruleset: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || exit 0
          git push -f origin publish
